<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maths &amp; Reasoning</title>
  <meta name="description" content="Maths and reasoning practice for Years 4 to 10 in English and Simplified Chinese.">
  <meta name="theme-color" content="#312e81">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maths &amp; Reasoning">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <img src="./icons/icon.svg" alt="" width="36" height="36">
      <div>
        <h1 data-i18n="app.title">Maths &amp; Reasoning</h1>
        <p class="tagline" data-i18n="app.tagline">Years 4 to 10</p>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" id="langBtn" class="pill" data-i18n="lang.switch" data-i18n-aria="lang.label">中文</button>
      <button type="button" id="parentBtn" class="pill" aria-pressed="false"><span id="parentIcon" aria-hidden="true">🔒</span> <span id="parentLabel" data-i18n="nav.parent">Parent</span></button>
    </div>
  </header>

  <nav class="tabs" aria-label="Main">
    <button type="button" class="tab" data-go="home" data-i18n="nav.home">Home</button>
    <button type="button" class="tab" data-go="progress" data-i18n="nav.progress">Progress</button>
  </nav>

  <main id="main" tabindex="-1">
    <!-- HOME -->
    <section id="screen-home" class="screen" aria-labelledby="homeH">
      <h2 id="homeH" data-i18n="home.heading">Set up your practice</h2>

      <fieldset>
        <legend data-i18n="home.subject">Subject</legend>
        <div class="chips chips-3 subject" id="subjectChips"></div>
        <p class="muted small note" id="subjectNote"></p>
      </fieldset>

      <div id="practiceOptions">
      <fieldset>
        <legend data-i18n="home.year">Year level</legend>
        <div class="chips chips-7" id="yearChips"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="home.topic">Topic</legend>
        <div class="chips chips-2" id="topicChips"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="home.diff">Difficulty</legend>
        <div class="chips chips-4 diff" id="diffChips"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="home.count">Number of questions</legend>
        <div class="chips chips-4" id="countChips"></div>
      </fieldset>
      </div>

      <div id="selOptions" hidden>
        <div class="card sel-card">
          <h3 data-i18n="sel.heading">Mathematical Reasoning practice test</h3>
          <ul class="rules">
            <li data-i18n="sel.rule1"></li>
            <li data-i18n="sel.rule2"></li>
            <li data-i18n="sel.rule3"></li>
            <li data-i18n="sel.rule4"></li>
            <li data-i18n="sel.rule5"></li>
          </ul>
        </div>
        <fieldset>
          <legend data-i18n="sel.length">Test length</legend>
          <div class="chips chips-1" id="selLenChips"></div>
        </fieldset>
      </div>

      <p class="source" id="sourceLine"></p>
      <button type="button" id="startBtn" class="btn primary big" data-i18n="home.start">Start practice</button>
      <button type="button" id="printHome" class="btn secondary"><span aria-hidden="true">🖨️</span> <span data-i18n="print.home">Print a worksheet (A4)</span></button>
    </section>

    <!-- LOADING -->
    <section id="screen-loading" class="screen" hidden>
      <div class="loading">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loadingText" role="status"></p>
      </div>
    </section>

    <!-- QUIZ: question cards; one at a time or in pages -->
    <section id="screen-quiz" class="screen" hidden aria-label="Quiz">
      <div class="quiz-top">
        <div class="quiz-head">
          <p id="qProgress" class="qprogress"></p>
          <p id="timer" class="timer" role="timer" hidden></p>
        </div>
        <div class="bar" aria-hidden="true"><div id="qBar"></div></div>
        <div class="toolbar">
          <div class="seg" role="group" data-i18n-aria="view.label">
            <button type="button" id="viewSingle" class="seg-btn" data-i18n="view.single">One at a time</button>
            <button type="button" id="viewPages" class="seg-btn" data-i18n="view.pages">Pages</button>
          </div>
          <button type="button" id="printQuiz" class="tool-btn"><span aria-hidden="true">🖨️</span> <span data-i18n="print.btn">Print</span></button>
        </div>
      </div>

      <div id="qList" class="qlist"></div>

      <div id="pageNav" class="row" hidden>
        <button type="button" id="prevPage" class="btn secondary" data-i18n="view.prevPage">Previous page</button>
        <button type="button" id="nextPage" class="btn primary" data-i18n="view.nextPage">Next page</button>
      </div>
      <p id="answerAll" class="muted small center" data-i18n="quiz.answerAll" hidden></p>
      <button type="button" id="toResults" class="btn primary" data-i18n="quiz.finish" hidden>See results</button>

      <div id="examNav" hidden>
        <div class="row" id="examSingleNav">
          <button type="button" id="prevQ" class="btn secondary" data-i18n="sel.prev">Previous</button>
          <button type="button" id="nextQ" class="btn primary" data-i18n="sel.next">Next</button>
        </div>
        <p class="muted small answered" id="answeredCount"></p>
        <p class="label" id="paletteLabel" data-i18n="sel.palette">Go to question</p>
        <div id="palette" class="palette" role="group" aria-labelledby="paletteLabel"></div>
        <button type="button" id="finishBtn" class="btn primary finish" data-i18n="sel.finish">Finish test</button>
      </div>
      <button type="button" id="quitBtn" class="btn ghost" data-i18n="quiz.quit">Quit</button>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen" hidden aria-labelledby="resH">
      <h2 id="resH" data-i18n="res.heading">Results</h2>
      <div class="score-card">
        <p id="resScore" class="score"></p>
        <p id="resMsg"></p>
        <p id="resTime" class="muted small" hidden></p>
      </div>
      <div id="resCats" class="res-cats" hidden></div>
      <p id="resLocked" class="muted" data-i18n="res.locked"></p>
      <button type="button" id="unlockBtn" class="btn secondary" data-i18n="res.unlock">Parent: show answers</button>
      <ol id="resList" class="review"></ol>
      <button type="button" id="printResults" class="btn secondary"><span aria-hidden="true">🖨️</span> <span data-i18n="print.results">Print these questions</span></button>
      <button type="button" id="againBtn" class="btn primary" data-i18n="res.again">Practise again</button>
      <button type="button" id="homeBtn" class="btn ghost" data-i18n="res.home">Change settings</button>
    </section>

    <!-- PROGRESS -->
    <section id="screen-progress" class="screen" hidden aria-labelledby="progH">
      <h2 id="progH" data-i18n="prog.heading">Progress</h2>
      <div id="progBody"></div>
    </section>

    <!-- PARENT SETTINGS -->
    <section id="screen-parent" class="screen" hidden aria-labelledby="parH">
      <h2 id="parH" data-i18n="parent.heading">Parent settings</h2>

      <div class="card">
        <h3 data-i18n="parent.aiHeading">Question source</h3>
        <p class="muted small" data-i18n="parent.aiInfo"></p>
        <fieldset>
          <legend data-i18n="parent.provider">Provider</legend>
          <div class="chips chips-1" id="providerChips"></div>
        </fieldset>
        <div id="aiFields">
          <label class="label" for="aiKey" data-i18n="parent.key">API key</label>
          <input id="aiKey" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="parent.keyPh">
          <label class="label" for="aiModel" data-i18n="parent.model">Model</label>
          <select id="aiModel"></select>
          <button type="button" id="aiTest" class="btn secondary" data-i18n="parent.test">Test connection</button>
        </div>
        <p id="aiMsg" class="small" role="status"></p>
        <button type="button" id="aiSave" class="btn primary" data-i18n="parent.save">Save</button>
      </div>

      <div class="card">
        <h3 data-i18n="parent.pinHeading">Parent PIN</h3>
        <p class="muted small" data-i18n="pin.note"></p>
        <button type="button" id="changePin" class="btn secondary" data-i18n="parent.changePin">Change PIN</button>
      </div>

      <button type="button" id="lockBtn" class="btn ghost" data-i18n="parent.lock">Lock parent mode</button>
    </section>
  </main>

  <dialog id="pinDialog" aria-labelledby="pinTitle">
    <form method="dialog" id="pinForm" novalidate>
      <h3 id="pinTitle"></h3>
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-labelledby="pinTitle">
      <p id="pinMsg" class="bad small" role="alert"></p>
      <div class="row">
        <button type="button" id="pinCancel" class="btn ghost" data-i18n="pin.cancel">Cancel</button>
        <button type="submit" id="pinOk" class="btn primary" data-i18n="pin.ok">OK</button>
      </div>
      <button type="button" id="pinForgot" class="link small" data-i18n="pin.forgot">Forgot PIN?</button>
    </form>
  </dialog>

  <dialog id="printDlg" aria-labelledby="printTitle">
    <form method="dialog" id="printForm">
      <h3 id="printTitle" data-i18n="print.title">Print on A4 paper</h3>
      <label class="check"><input type="checkbox" id="printAnswers"> <span data-i18n="print.answers">Answer key on a separate page</span></label>
      <label class="check"><input type="checkbox" id="printWorking" checked> <span data-i18n="print.working">Include worked solutions</span></label>
      <p class="muted small" data-i18n="print.tip"></p>
      <div class="row">
        <button type="button" id="printCancel" class="btn ghost" data-i18n="pin.cancel">Cancel</button>
        <button type="submit" id="printGo" class="btn primary" data-i18n="print.go">Print</button>
      </div>
    </form>
  </dialog>

  <div id="printArea" class="print-area" aria-hidden="true"></div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="./js/i18n.js"></script>
  <script src="./js/checker.js"></script>
  <script src="./js/figures.js"></script>
  <script src="./js/gen-core.js"></script>
  <script src="./js/gen-maths.js"></script>
  <script src="./js/gen-word.js"></script>
  <script src="./js/gen-ga.js"></script>
  <script src="./js/gen-selective.js"></script>
  <script src="./js/ai.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
